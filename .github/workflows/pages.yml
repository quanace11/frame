# Builds src/ into dist/ and publishes the app to GitHub Pages on every push to main.
# The built index.html / sw.js are NOT committed any more: they carried a new version stamp in every
# branch, so every pull request conflicted with every other one.
# One-time setting: Settings → Pages → Build and deployment → Source = "GitHub Actions".
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/build.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # deploy in its own job (GitHub's template): deploying in the same job right after the upload can miss the artifact
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
